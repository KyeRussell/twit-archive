name: Build TWiT archive feed

on:
  # TWiT records live Sunday afternoon (US); grab the new episode Monday.
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-crawl every episode from scratch"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - build_feed.py
      - .github/workflows/build-feed.yml

# Needed to commit the refreshed feed/cache back to the repo.
permissions:
  contents: write

concurrency:
  group: twit-archive-feed
  cancel-in-progress: false

env:
  # Public subscribe URL (served straight from the repo by jsDelivr's CDN).
  FEED_SELF_URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/public/feed.xml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build feed
        run: |
          python build_feed.py --workers 12 --out public \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '--full' || '' }}

      - name: Commit refreshed cache + feed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json public/feed.xml public/index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "Update TWiT archive feed ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          # Best-effort purge so subscribers see new episodes within minutes.
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/feed.xml" || true
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/index.html" || true
