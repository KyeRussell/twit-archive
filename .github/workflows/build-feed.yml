name: Build TWiT archive feed

on:
  # TWiT records live Sunday afternoon (US); grab the new episode Monday.
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-crawl every episode from scratch"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - build_feed.py
      - .github/workflows/build-feed.yml

permissions:
  contents: write   # commit refreshed feed/cache back to the repo
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: twit-archive-feed
  cancel-in-progress: false

env:
  FEED_SELF_URL: https://kyerussell.github.io/twit-archive/feed.xml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build feed
        run: |
          python build_feed.py --workers 12 --out public \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '--full' || '' }}

      - name: Commit refreshed cache + feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json public/feed.xml public/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update TWiT archive feed ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
